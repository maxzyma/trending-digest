<!DOCTYPE html>
<!--
  跨源主题聚类页 layout。正文由 scripts/materialize_taxonomy.py 从 taxonomy/rollup.md 物化，
  本 layout 只负责壳与表格样式（rollup 是宽表，须可横向滚动）。
-->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Trending Digest</title>
  <meta name="description" content="{{ page.description }}">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0e1116; --surface:#161b22; --border:#2a313c; --fg:#e6edf3; --muted:#9aa7b4; --accent:#58a6ff; --pulse:#3fb950;
      --serif:"Source Serif 4","Noto Serif SC",serif; --mono:"JetBrains Mono",monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--serif); line-height:1.6; }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    /* 默认焦点环是深蓝，在深色底上对比度不足；用 accent 显式指定。 */
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .site-header { border-bottom:1px solid var(--border); }
    .header-inner { max-width:960px; margin:0 auto; padding:1rem 1.5rem; font-family:var(--mono); font-size:.85rem; }
    main { max-width:960px; margin:0 auto; padding:2rem 1.5rem 6rem; }
    h1 { font-size:2rem; margin:0 0 .4rem; }
    .lead { color:var(--muted); margin:0 0 2rem; }
    h2 { font-size:1.3rem; margin:2.5rem 0 .8rem; }
    h3 { font-size:1.05rem; margin:2rem 0 .6rem; font-family:var(--mono); }
    blockquote { margin:1.5rem 0; padding:.8rem 1.2rem; border-left:3px solid var(--pulse); background:var(--surface); color:var(--muted); }
    blockquote p { margin:0; }
    .table-scroll { overflow-x:auto; margin:1.2rem 0; }
    table { border-collapse:collapse; width:100%; font-size:.9rem; }
    th, td { border:1px solid var(--border); padding:.5rem .7rem; text-align:left; white-space:nowrap; }
    th { background:var(--surface); font-family:var(--mono); font-size:.78rem; color:var(--muted); font-weight:500; }
    td:first-child, tbody th[scope=row] { font-family:var(--mono); font-size:.85rem; white-space:normal; }
    tbody th[scope=row] { background:none; color:var(--fg); font-weight:400; text-align:left; }
    code { font-family:var(--mono); font-size:.85em; background:var(--surface); padding:.1rem .35rem; border-radius:4px; margin:0 .15em; }
    ul, ol { padding-left:1.4rem; }
    li { margin:.3rem 0; }
    .table-scroll:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    /* 页头横向导航：源之间可直接跳转，不必回首页中转 */
    .header-inner { display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem 1.1rem; }
    .header-inner .brand { white-space:nowrap; }
    .source-nav { display:flex; flex-wrap:wrap; gap:.4rem 1.1rem; margin-left:auto; }
    .source-nav a { color:var(--muted); }
    .source-nav a:hover { color:var(--accent); }
    .source-nav a[aria-current="page"] { color:var(--fg); font-weight:500; }
  </style>
</head>
<body>
  {% include site-header.html %}
  <main data-testid="taxonomy-rollup">
    <h1>{{ page.heading | default: page.title }}</h1>
    <p class="lead">{{ page.description }}</p>
    {{ content }}
  </main>
  <script>
    // rollup 表由 markdown 渲染，拿不到 scope/caption，也没有可滚动容器。
    // 这里补齐：宽表包一层横向滚动容器（窄屏不裁切），容器可聚焦以便键盘滚动，
    // 表头补 scope，并加一个仅供辅助技术朗读的 caption。
    document.querySelectorAll('main > table').forEach(function (table, i) {
      var wrap = document.createElement('div')
      wrap.className = 'table-scroll'
      wrap.tabIndex = 0
      wrap.setAttribute('role', 'region')
      wrap.setAttribute('aria-label', document.querySelector('h1').textContent.trim())
      table.parentNode.insertBefore(wrap, table)
      wrap.appendChild(table)

      table.querySelectorAll('thead th').forEach(function (th) {
        th.setAttribute('scope', 'col')
      })
      // scope 只在 th 上有效，所以行头要真的换成 th，不能给 td 加属性
      table.querySelectorAll('tbody tr > td:first-child').forEach(function (td) {
        var th = document.createElement('th')
        th.setAttribute('scope', 'row')
        th.innerHTML = td.innerHTML
        th.className = td.className
        td.replaceWith(th)
      })
      if (!table.querySelector('caption')) {
        var cap = document.createElement('caption')
        cap.className = 'sr-only'
        cap.textContent = '跨源主题分布：主题、趋势、近窗与前窗计数、累计、项目数、覆盖源与状态'
        table.insertBefore(cap, table.firstChild)
      }
    })
  </script>
</body>
</html>
