summary = "通用 agent 框架赛道整体略有退潮（近窗 5 / 前窗 6），但这不是热度消散，而是重心在转移：以 AutoGPT 从命令行自主 agent 转型为托管编排平台为缩影，\"怎么搭一个 agent\"的框架之争正在让位给\"怎么让 agent 长期、安全、成规模地干活\"的运行层问题。社区 repo 与 Claude 官方博客在这一点上明显同向押注：GitHub 侧集中出现云端执行环境、跨会话持久状态与交接、身份权限审批与审计治理、把 agent 当组织成员编排的控制面；Claude Managed Agents 则连续补齐托管运行、内置记忆、自托管沙箱与私有 MCP 隧道，几乎逐项对应同一组需求。往后看，赛道更可能沿两条线演进：一是垂直化，如实时语音、法律交付物评测；二是基础设施化，沙箱、记忆、治理逐步沉淀为平台标配，独立\"框架\"本身的叙事空间会继续收窄。"

