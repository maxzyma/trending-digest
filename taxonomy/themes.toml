summary = "编码 agent 赛道热度持稳，但重心正从“再做一个终端 CLI”转向外壳（harness）层的工程化：社区 repo 在做云端后台 agent、长时自改进循环、破坏性命令拦截和代码图谱上下文，Claude 官方博客同期在讲并行多会话、hooks/skills/subagents 定制和“设计 loop 而非写 prompt”，两边都在押注编排、护栏和可控性。另一条结构性信号是 CLI 外壳本身在快速商品化，Kimi、DeepSeek 定制版以及 fork 自 Codex 的 Open Interpreter 都说明，模型厂商和社区都把一套成熟 agent 外壳当作承载自家或廉价模型的标配入口。下一阶段的差异化大概率不在单 agent 能力，而在异步、并行、安全执行和跨会话经验沉淀。研究侧（Lil'Log）本窗口暂无对应信号，这一轮仍主要由工程实践驱动。"

