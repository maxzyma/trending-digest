schema_version = 1
synthesized_on = "2026-11-09"
lede = "本周生态的共同走向是 agent 从“会写代码”走向“长期、受控地交付成品”：编码外壳、技能包、数据语义层、身份授权与沙箱记忆等基础设施在社区与 Claude 官方两端同步补齐，竞争焦点正从模型能力上移到 harness、治理与可交付产物。与此同时，路线开始分化，厂商押注云端托管与企业集成，社区则押注本地优先、自托管与数据不出设备；非 agent 赛道多为社区长尾轮动，缺乏跨源共振。"

[[theme]]
id = "agent-deliverables-and-artifacts"
label = "agent-deliverables-and-artifacts"
status = "canonical"
definition = "让 Agent 生成、重建或交付可直接查看、编辑、分享或继续协作的最终产物，包括 PPTX、DOCX、XLSX、HTML/SVG、draw.io、Excalidraw、CAD 与可分享 Artifact；不收录仅增强推理、记忆、编排、运行时或工具连接的项目，也不把普通代码生成视为本主题交付物。"
aliases = ["agent-artifact-tools", "agent-deliverable-tools", "editable-agent-output"]
sources = ["github-trends", "claude-blog"]
first_seen = "2026-06-17"
last_seen = "2026-10-27"
occurrences = 11
summary = "agent 的竞争焦点正从\"写代码\"外溢到\"交付成品\"：社区 repo 集中以 Claude Code / Codex 技能包形态，把架构图、PPT、CAD/URDF、竞赛论文等直接产出为可编辑、可打开的文件；同期 Claude 官方博客也推出 Claude Code artifacts 与和品牌规范对齐的 Claude Design，形成社区与官方同时押注\"agent 产物即交付物\"的跨源共振，Lil'Log 侧暂无对应信号。结构上出现明显分层：上层是面向具体格式的技能插件，下层是 json-render 式的受约束生成式 UI 框架，以及 Univer 这类把老牌办公内核重新定位为\"AI Agent Office Harness\"的基础设施。赛道处于升温初期，后续看点在于产物能否稳定满足原生格式可编辑、品牌与模板一致、会话内可持续更新这几项要求，单纯\"出一张图\"的工具会迅速同质化。"

