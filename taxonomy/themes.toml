summary = "社区侧 skill/插件的新增热度较前窗略有回落（4 vs 5），但并非赛道降温，而是结构在分化。通用型 awesome 清单的风头让位给更垂直的能力包：代码知识图谱省 token、UI 审美约束、领域/书本知识注入、安全分析路由，且普遍以 SKILL.md 和 MCP 为载体，同时兼容 Claude Code、Cursor、Codex 等多个客户端，「一次编写、跨 agent 分发」已成社区默认形态。官方侧同步夯实底座：MCP 新规范转向无状态核心并加固授权，连接器从工作工具扩展到生活类应用，与社区本地优先、零 API key 的 MCP 工具形成一上一下的互补。研究源（Lil'Log）在本窗缺席，说明这条赛道当前由工程与生态驱动而非研究驱动，后续看点在于协议标准化后 skill 的质量分层与分发治理。"

