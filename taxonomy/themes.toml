summary = "数据基础设施赛道正在从\"给人用的管道和报表\"转向\"给 agent 用的可信上下文层\"：社区 repo 集中在语义层标准化（统一指标口径）、带治理的 GenBI/NL2SQL 和可溯源的知识图谱，Claude 官方博客也在讲用 Claude 在 Slack 里做自助数据分析，社区和官方同时押注\"自然语言直连数仓\"，而且都把准确率和口径一致性当作核心难题。上游摄取端同步升温，网页清洗、PDF 解析与 OCR 分流这类\"喂给 LLM 的干净数据\"组件已经成了 RAG/agent 管线的标配；连本地行情库这类垂直数据工具也开始默认提供 MCP 接口。往后看，竞争焦点会从编排和存储本身转向\"语义契约 + 血缘溯源 + agent 接入协议\"；pgrust 这类由 AI 代理生成的数据库重写则说明，底层引擎本身也开始被 AI 编码改造。不过该赛道目前仅从前窗 0 升至近窗 1，样本仍小，更适合看作结构性信号的早期显现，而非已成定局的浪潮。"

