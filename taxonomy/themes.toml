summary = "这一赛道的热度已明显回落（近窗仅 1 个新信号，前窗为 3 个），而且几乎全部来自 GitHub 社区。Claude 官方博客没有涉及，研究侧只有 Lil'Log 那篇较早的视频扩散综述，说明它已经从模型前沿突破，进入社区工程化、产品化的沉淀期。结构上的共同取向很清楚：本地优先、数据不出机、无订阅，用开源工具逐项替代 CapCut、配音、听写这类付费 SaaS。实现方式是把 Whisper、LLM、TTS/声音克隆、FFmpeg 串成端到端流水线，同时把模型压到 CPU 级别也能跑。后续的增量更可能出现在单图转 3D、长视频自动切片这类细分生产链路，而不是新一轮生成能力的爆发。"

