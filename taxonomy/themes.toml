summary = "推理赛道正在明显升温，并沿两条线分化：一条是“把超大模型拉回个人设备”，社区通过 1-bit/三值量化、异构卸载、SSD 流式加载和针对特定模型的专用引擎，让 27B 到 671B 级 MoE 模型能在笔记本、Mac 甚至手机上运行；另一条是“推理入口的网关化”，大量 repo 在 OpenAI、Anthropic 等协议之间做翻译、路由和号池聚合，其中包括依赖逆向接口或共享订阅的灰色方案。官方侧则用托管与治理来回应同一需求，Claude 正式登陆 Microsoft Foundry，模型可以进入企业现有的云、计费和权限体系。社区 repo 和官方博客因此在押注同一件事：模型调用正在脱离单一厂商入口。更底层的结构变化是，算子与硬件栈正在去 CUDA 化、走向专用化，例如模型厂商开源自研注意力内核、Mojo/MAX 被 Qualcomm 收购、ANE 被逆向改造用于训练。Lil'Log 早年系统梳理的量化、蒸馏等推理优化手段，如今正从论文落地为普通开发者手里的工具链。"

