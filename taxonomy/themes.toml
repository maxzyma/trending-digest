summary = "编码 agent 赛道热度持稳，但重心已从「谁家模型写代码更强」转向「外壳（harness）与运行环境」的竞争：社区 repo 集中在命令拦截 hook、云端后台 agent、浏览器隔离空间、代码图谱检索等周边基础设施，与 Claude 官方博客同期主推的 hooks/skills/subagents 定制、多会话并行桌面端和「设计 loop 而非写 prompt」形成明显的跨源共振。另一条结构性变化是外壳与模型的解耦和再绑定同时发生：Open Interpreter 直接 fork Codex CLI 去适配廉价/本地模型，而 Kimi、DeepSeek 等厂商与社区则在为特定模型定制专属 CLI，说明 agent 外壳正在成为可复用、可移植的标准层。往前看，长时自主运行、自改进循环与多 agent 并行编排将是下一阶段焦点，安全护栏与可观测性会随之从可选插件变成必需品；Lil'Log 本窗口在该赛道暂无信号，研究侧尚未跟进这波工程化浪潮。"

