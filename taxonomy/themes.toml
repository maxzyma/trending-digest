summary = "编码 agent 赛道正在升温，竞争焦点从\"谁的模型更会写代码\"转向\"外壳（harness）怎么搭\"：社区一侧密集涌现针对特定或廉价模型的终端 agent（Kimi、DeepSeek、基于 Codex fork 的 Open Interpreter 重写版），Claude 官方博客也在同步讲解 hooks、skills、subagents 与\"设计循环\"，两边都把可定制的执行外壳当作核心变量。结构上有两条明显轨迹：一是从单会话交互走向并行与异步，官方桌面端重做为多 agent 并行，社区则把 agent 搬进云沙箱，由 Slack、PR、cron 触发后台运行，甚至可以连跑数小时并自我沉淀经验；二是配套层开始成形，破坏性命令拦截、代码图谱检索、AI 代码审查、agent 专用浏览器等护栏和上下文工具补齐了长时自治所需的安全与感知能力。"

