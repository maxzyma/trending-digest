schema_version = 1
synthesized_on = "2026-11-23"
lede = "本周整个生态的重心正从\"模型能力\"下沉到\"让 agent 可靠交付\"：社区与 Claude 官方同时押注运行时与沙箱、技能包与协议、身份与治理这几层基础设施，agent 产出的价值也从\"写对代码\"转向\"可直接用的成品\"。与之并行的是一条\"本地优先、去云化\"的社区暗线，覆盖推理、桌面、硬件和自托管应用；与 AI 主线脱钩的创作、学习与数据基建类赛道则在降温，其价值正被 agent 工作流吸收。"

[[theme]]
id = "agent-deliverables-and-artifacts"
label = "agent-deliverables-and-artifacts"
status = "canonical"
definition = "让 Agent 生成、重建或交付可直接查看、编辑、分享或继续协作的最终产物，包括 PPTX、DOCX、XLSX、HTML/SVG、draw.io、Excalidraw、CAD 与可分享 Artifact；不收录仅增强推理、记忆、编排、运行时或工具连接的项目，也不把普通代码生成视为本主题交付物。"
aliases = ["agent-artifact-tools", "agent-deliverable-tools", "editable-agent-output"]
sources = ["github-trends", "claude-blog"]
first_seen = "2026-06-17"
last_seen = "2026-11-17"
occurrences = 12
summary = "<thinking_mode>\nTrend is 持稳 (1/1). Write 2-4 sentences.\n</thinking_mode>\n\nagent 的价值衡量正在从\"写对代码\"转向\"交付可直接用的成品\"：社区 repo 集中以技能包/插件形态挂进 Claude Code、Codex 等编程 agent，产出可编辑 .pptx、单文件 HTML 图表、CAD/URDF、可提交的 LaTeX/PDF 论文等终端格式，而 Claude 官方同期让 Claude Code 支持自更新的 artifacts、让 Claude Design 打通设计系统与 Claude Code，形成社区与官方同时押注\"agent 产出物即交付物\"的跨源共振。结构上出现两条值得注意的线索：一是\"受约束生成\"走向基础设施化（json-render 用组件目录框住模型输出，Univer 这类老牌办公内核整体改口为\"AI agent 的 Office harness\"）；二是交付物从单件图表向长流程成品延伸，Google Research 的多智能体写论文和建模竞赛全流程 agent 都把审校、排版纳入闭环。热度虽持稳，但赛道正从零散的\"出图小工具\"收敛为\"编程 agent + 领域技能包 + 可编辑原生格式\"的标准形态，下一步竞争点大概率在品牌/模板一致性与产物的可二次编辑性上。"

