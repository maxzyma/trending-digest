summary = "推理与服务运行时赛道整体在退潮，热度几乎全部来自 GitHub 社区：官方博客只出现 Claude 进驻 Azure Foundry 这类云端分发与治理新闻，Lil'Log 的推理优化综述仍停在 2023 年，研究侧和官方侧都没有新押注。社区端正在分成两头。一头是\"超大模型下沉到个人设备\"，手段包括 1-bit/ternary 极限量化、异构卸载、SSD 流式加载权重、只为少数模型深度定制的专用引擎，以及手写的模型专属内核，部分项目开始放弃通用框架，转向\"为一个模型造一台发动机\"。另一头是夹在客户端与模型之间的网关/代理层，做 OpenAI/Anthropic 协议互译、多端点路由，还有订阅号池与免费额度聚合。后者更多是在套利成本和接口碎片，而不是推进推理技术，也处在服务条款的灰色地带。底座层面，Modular 被 Qualcomm 收购，说明跨厂商替代 CUDA 的路线正被硬件巨头收编。这个赛道正从通用 serving 框架之争，转向端侧专用化和接入层整合。"

