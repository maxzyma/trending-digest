summary = "通用 Agent 框架这一层热度小幅回落（近窗 4 / 前窗 5），老牌项目 AutoGPT 已从自主 agent 转型为可视化编排平台，说明\"再造一个框架\"的叙事正在让位于\"让 agent 可靠地跑起来\"的基础设施竞争。社区 repo 与 Claude 官方博客在同一组方向上下注：托管运行时与沙箱（cloudflare/computer 对应 Managed Agents 的自托管沙箱与 MCP 隧道）、跨会话持久状态（loopx 对应 Managed Agents 内置记忆），以及微软治理工具箱代表的身份、权限、审批与审计层。另一条结构性变化是把 Claude Code、Codex 等现成编码 agent 当作\"员工\"来编排，paperclip、buzz、swarm-forge 都在组织、协作与交接这一层下功夫，不再从零写 agent 本身；与此同时，语音实时交互和法律交付物评测等垂直方向在分化出来。整体看，赛道正从框架层向运行时、控制面与治理层下沉，竞争焦点转向生产化与长期运行。"

