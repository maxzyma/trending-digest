summary = "Agent 扩展层正在升温：社区 repo 与 Claude 官方博客同时押注同一套底座。官方一边把 MCP 推进到无状态核心并加固授权，一边把连接器从工作工具铺向 AllTrails、Instacart 等日常应用；社区则以 SKILL.md 为事实标准，批量产出可跨 Claude Code、Codex、Cursor 通用的能力包。结构上，赛道正从\"给 agent 接一个工具\"转向两类更高阶的封装。一类把审美与领域知识做成 skill，例如反千篇一律的 UI 约束、书籍、本地化和逆向安全工作流；另一类走本地优先的上下文基础设施，例如代码知识图谱、文件化计划记忆和零成本联网，核心诉求是压缩 token、对抗上下文丢失。研究侧（Lil'Log）在本窗口暂无对应信号，说明这一波仍由工程实践和平台标准驱动。下一步的竞争焦点可能落在 skill 的分发、路由与治理上：awesome 清单、`npx` 一键安装、按需加载路由层已初具\"包管理器\"形态。"

