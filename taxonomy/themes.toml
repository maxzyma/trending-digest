summary = "这个赛道几乎完全由 GitHub 社区驱动：Claude 官方博客没有相关信号，Lil'Log 只有一篇较早的视频扩散综述作为研究底座，说明它与模型厂商的主叙事基本脱钩。社区侧的共同主线是\"本地优先、去订阅\"，包括 CapCut 开源替代、本机配音与声音克隆、端侧听写和 CPU 级 TTS，以及单图转 3D。竞争焦点正从模型能力转向把转写、翻译、合成、剪辑串成开箱即用的端到端工作台。不过近窗热度已归零（前窗 2），说明这股以工具化和平替为主的浪潮正在退潮，后续更可能是存量项目迭代（如 YuE2），而不是新项目集中涌现。"

