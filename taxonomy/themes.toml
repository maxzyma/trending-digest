schema_version = 1
synthesized_on = "2026-11-16"
lede = "本周生态的主轴已从“模型能做什么”转向“agent 如何可靠、长期、可治理地干活”：社区 repo 与 Claude 官方同时押注 harness、托管运行时、记忆沙箱、身份权限与 SKILL.md/MCP 等扩展标准，交付物也从建议变成原生可编辑的成品文件，竞争焦点正向运行层、分发层和治理层下沉。与此同时，音视频、桌面、硬件、推理等社区主导的赛道普遍走向“本地优先、去云去订阅”，与官方“企业托管集中分发”形成结构性分岔，模型调用正在脱离单一厂商入口。"

[[theme]]
id = "agent-deliverables-and-artifacts"
label = "agent-deliverables-and-artifacts"
status = "canonical"
definition = "让 Agent 生成、重建或交付可直接查看、编辑、分享或继续协作的最终产物，包括 PPTX、DOCX、XLSX、HTML/SVG、draw.io、Excalidraw、CAD 与可分享 Artifact；不收录仅增强推理、记忆、编排、运行时或工具连接的项目，也不把普通代码生成视为本主题交付物。"
aliases = ["agent-artifact-tools", "agent-deliverable-tools", "editable-agent-output"]
sources = ["github-trends", "claude-blog"]
first_seen = "2026-06-17"
last_seen = "2026-11-17"
occurrences = 12
summary = "这一赛道的核心是让 agent 直接交付可用的成品文件，而不只是给出建议或代码。社区 repo 大量以\"技能包/插件\"形态挂进 Claude Code、Codex、Cursor，覆盖架构图、可编辑 PPT、CAD/URDF、竞赛论文等场景；官方博客则通过 Claude Code artifacts 和 Claude Design 与 Code 的打通，把\"可分享、可编辑的产物\"做成平台原生能力，两边方向一致。结构上，竞争重点正从\"能不能生成\"转向\"能不能可靠地生成\"：用组件目录约束输出（json-render），产出原生可编辑格式（.pptx、draw.io XML），以及 univer 这类老牌办公内核重新定位为 agent 读写文档的底座。不过近窗新增已降到 0，且研究侧（Lil'Log）始终没有跟进。赛道看起来正从概念爆发期进入沉淀期，后续增量更可能来自官方平台的原生化和办公/设计底座的接入，而不是新的独立技能包。"

