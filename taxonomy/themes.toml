# themes.toml — cross-source theme registry (SSoT).
# AI-maintained: born from data, self-iterated by reconcile, human edits optional.
# `id` is stable/immutable (cross-time key). `label` may evolve. `aliases`
# remaps merged/historical labels + old ids so past tags keep resolving.
# Do not hand-rewrite ids; edit labels/definitions/status freely if needed.

schema_version = 1
synthesized_on = "2026-09-14"
lede = "本周技术生态正全面跨越早期的概念探索，加速沉降至由严苛护栏、受控沙箱与标准化协议（如 MCP）支撑的“端到端终态交付”深水区。全栈基础设施因而迎来结构性重塑：向上全面演进为面向智能体协作、消费与行为审计的 AI 原生基座，向下则坚定筑牢“本地优先”、极端硬件压榨与数据主权自决的坚固防线。"

[[theme]]
id = "agent-deliverables-and-artifacts"
label = "agent-deliverables-and-artifacts"
status = "canonical"
definition = "让 Agent 生成、重建或交付可直接查看、编辑、分享或继续协作的最终产物，包括 PPTX、DOCX、XLSX、HTML/SVG、draw.io、Excalidraw、CAD 与可分享 Artifact；不收录仅增强推理、记忆、编排、运行时或工具连接的项目，也不把普通代码生成视为本主题交付物。"
aliases = ["agent-artifact-tools", "agent-deliverable-tools", "editable-agent-output"]
sources = ["github-trends", "claude-blog"]
first_seen = "2026-06-17"
last_seen = "2026-09-13"
occurrences = 8
summary = "当前 AI 智能体正加速从“文本与代码片段生成”跃迁为“端到端终态交付物（Artifacts）”的创造者，Claude 官方博客将可视化制品与品牌设计系统深度内建，而 GitHub 开源社区则密集涌现各类垂直交付技能包，形成官方平台与民间生态的双向共振。交付物形态已显著跨越初级的图文混排，全面拓展至零构建单文件 SVG 架构图、原生可编辑 PPTX、高精排版学术论文乃至工业级 CAD 实体建模等高度专业化领域。该赛道整体热度保持稳健，其结构性演进清晰指向：以智能体为中枢，直接穿透格式屏障，产出开箱即用、可直接消费与协作的高价值生产级资产。"

