schema_version = 1
synthesized_on = "2026-11-02"
lede = "本周生态的共同走向是让 agent 从“会写代码的助手”变成能长期驻留、交付成品的生产主体：社区用 SKILL.md 技能包和本地优先、自托管工具把能力与数据握在自己手里，Claude 官方则押注沙箱执行、跨会话记忆、MCP 协议和 agent 身份治理。竞争焦点因此正从单个模型或单个 CLI 的能力，转向编排、护栏、可审计和可直接交付的产物这一层“agent 操作系统”；推理、开发工具、游戏、硬件等赛道仍以社区单源自驱为主，尚未形成跨源共识。"

[[theme]]
id = "agent-deliverables-and-artifacts"
label = "agent-deliverables-and-artifacts"
status = "canonical"
definition = "让 Agent 生成、重建或交付可直接查看、编辑、分享或继续协作的最终产物，包括 PPTX、DOCX、XLSX、HTML/SVG、draw.io、Excalidraw、CAD 与可分享 Artifact；不收录仅增强推理、记忆、编排、运行时或工具连接的项目，也不把普通代码生成视为本主题交付物。"
aliases = ["agent-artifact-tools", "agent-deliverable-tools", "editable-agent-output"]
sources = ["github-trends", "claude-blog"]
first_seen = "2026-06-17"
last_seen = "2026-10-27"
occurrences = 11
summary = "这个赛道正在升温：agent 的产出终点正从\"代码和文本\"扩展到可直接交付的成品，包括架构图、可编辑 PPT、CAD/URDF、排版好的论文 PDF 和生成式 UI。社区 repo 与 Claude 官方博客同时在押注。官方用 Claude Code artifacts 和 Claude Design 把\"可视化、可分享、贴合品牌规范的交付页\"做成一等公民；社区则几乎清一色以\"装进 Claude Code / Codex / Cursor 的技能包\"形态，把各类专业格式逐个接上。结构上有两个变化值得注意：一是交付物普遍追求零依赖的单文件 HTML 或原生可编辑格式（.pptx、draw.io XML、OpenCASCADE 模型），强调拿来即用、可继续人工修改，而不是只出一张截图；二是 Univer 这类老牌文档内核开始重新定位为\"agent 的 office harness\"，说明基础设施层也在向 agent 读写文档靠拢。目前 Lil'Log 一侧尚无对应研究信号，这股势头仍以工程与产品驱动为主，下一步大概率会走向交付物的规范约束（设计系统、组件目录）与长会话中的持续自更新。"

