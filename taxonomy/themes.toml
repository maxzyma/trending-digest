summary = "agent 框架赛道正在明显升温，重心从\"怎么写一个 agent\"转向\"怎么让 agent 长期、安全地在真实环境里干活\"。社区 repo 与 Claude 官方博客同时押注同一组基础设施：云端/自托管沙箱执行环境、跨会话持久状态与记忆、MCP 连接，以及身份、权限、审批、审计这类治理层。另一个结构性变化是 agent 被当作\"组织成员\"来编排：多 agent 分工、预算与汇报关系、与人共用协作空间，老牌项目也从自主 agent demo 转型为可视化编排平台。接下来的竞争点大概率在托管平台与开源控制面之间：谁能把执行环境、状态和治理打包成默认选项，以及垂直场景（语音、法律）能否用评测和专用框架证明 agent 可以交付生产级结果。"

